<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Free Kick Hero 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800;1,900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #d7192d;
    --blue: #1d5fc0;
    --gold: #ffd23f;
    --ink: rgba(7, 12, 28, .62);
    --display: "Barlow Condensed", "Arial Narrow", Impact, system-ui, sans-serif;
    --text: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #060b1a; overflow: hidden; overscroll-behavior: none; }
  body { font-family: var(--text); color: #fff; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx {
    touch-action: none;            /* drag with a finger without scrolling the page */
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    cursor: grab;
  }
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px 0; pointer-events: none; }
  .bar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    background: var(--ink); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 14px; padding: 8px 12px;
  }
  .teams { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 10px;
    font: italic 800 15px/1 var(--display); letter-spacing: .04em; }
  .teams i { font-style: normal; opacity: .55; font-weight: 600; }
  .chip { width: 22px; height: 8px; border-radius: 4px; }
  .chip.red { background: var(--red); } .chip.blue { background: var(--blue); }
  .stat { font: italic 800 22px/1 var(--display); }
  .stat small { font: 600 11px/1 var(--text); opacity: .7; margin-right: 5px; }
  .stat.r { text-align: right; }
  #pips { display: flex; gap: 6px; }
  .pip { width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.25); transition: background .2s; }
  .pip.goal { background: #3ddc84; } .pip.miss { background: #ff5560; }
  #banner { position: absolute; left: 0; right: 0; top: 15%; text-align: center; pointer-events: none; opacity: 0; }
  #banner.show { animation: pop .42s cubic-bezier(.2, 1.4, .4, 1) forwards; }
  #banner h1 {
    margin: 0; font: italic 900 clamp(48px, 17vw, 96px)/.9 var(--display); letter-spacing: .01em;
    text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 28px rgba(0,0,0,.5);
  }
  #banner p { margin: 8px 0 0; font: 600 17px/1.2 var(--text); text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #banner small { display: block; margin-top: 14px; font: 600 12px/1 var(--text); opacity: .75; }
  @keyframes pop { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }
  #hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 92%;
    background: var(--ink); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 9px 16px; border-radius: 999px; font: 600 14px/1.3 var(--text); text-align: center;
    pointer-events: none; transition: opacity .25s; white-space: nowrap;
  }
  #hint.hide { opacity: 0; }
  #over {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(4, 8, 20, .82); text-align: center; padding: 20px;
  }
  #over.show { display: flex; }
  #over h2 { margin: 0; font: italic 900 56px/1 var(--display); }
  #over .score { font: italic 900 108px/1 var(--display); color: var(--gold); margin: 10px 0 4px; }
  #over p { margin: 4px 0; font: 600 17px/1.3 var(--text); }
  #over p.dim { opacity: .65; font-size: 14px; }
  #again {
    margin-top: 26px; border: 0; border-radius: 999px; padding: 15px 44px; background: var(--red); color: #fff;
    font: italic 800 24px/1 var(--display); letter-spacing: .03em; cursor: pointer;
  }
  #again:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 30px;
    text-align: center; font: 600 17px/1.4 var(--text); background: #060b1a; }
  @media (prefers-reduced-motion: reduce) { #banner.show { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="hud">
    <div class="bar">
      <div class="teams"><span class="chip red"></span><span id="tHome">FC TWENTE</span><i>v</i><span id="tAway">SC HEERENVEEN</span><span class="chip blue"></span></div>
      <div class="stat"><small>Goals</small><span id="goals">0</span></div>
      <div id="pips" aria-hidden="true"></div>
      <div class="stat r"><small>Shot</small><span id="shotn">1</span>/<span id="shotsTotal">5</span></div>
    </div>
  </div>
  <div id="banner" role="status"><h1 id="bTitle"></h1><p id="bSub"></p><small id="bTap">Tap to continue</small></div>
  <div id="hint"></div>
  <div id="over">
    <h2>FULL TIME</h2>
    <div class="score" id="oScore">0/5</div>
    <p id="oMsg"></p>
    <p class="dim" id="oBest"></p>
    <button id="again" type="button">Play again</button>
  </div>
  <div id="fallback">This game needs WebGL. Try a recent version of Chrome, Safari, Edge or Firefox.</div>
</div>

<!-- app.py inlines three.min.js here. Opening this file directly loads it from the same folder. -->
<script src="three.min.js"></script>

<!-- app.py replaces this placeholder with the settings picked in the Streamlit sidebar.
     When you open this file directly in a browser the defaults below are used. -->
<script>/*__GAME_CONFIG__*/</script>

<script>
(() => {
'use strict';

/* ======================================================================
   SETTINGS - everything you might want to tweak lives up here
   ====================================================================== */
const CFG = Object.assign({
  shots: 5,                 // free kicks per round
  keeperSkill: 3,           // 1 (easy) .. 5 (hard)
  playerName: 'Ørjasæter',  // printed on the back of the shirt
  homeTeam: 'FC TWENTE',
  awayTeam: 'SC HEERENVEEN'
}, window.GAME_CONFIG || {});

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeOut = t => 1 - Math.pow(1 - t, 3);
const SHOTS = clamp(Math.round(CFG.shots), 1, 20);
const SKILL = clamp(CFG.keeperSkill, 1, 5);

// World units are metres. The goal line is z = 0, the goal is centred on x = 0,
// the pitch runs towards +z, and the camera looks along -z.
const R = 0.11;                         // ball radius used for collisions
const VR = 0.17;                        // ball radius drawn (a bit bigger so it reads from far away)
const GW = 7.32, GH = 2.44, HALF = GW / 2, POST = 0.06;   // real goal size
const NET_BACK = 2.1, NET_TOP_BACK = 1.4;
const WALL_DIST = 9.15, WALL_SP = 0.55, WALL_R = 0.3, WALL_H = 1.86;
const KEEPER_Z = 0.35;
const CAM_BACK = 4.6, CAM_H = 2.15, LOOK_Y = -1.1;         // camera sits behind the ball, looking at the goal
const GRAB_PX = 0.13;                   // grab radius around the ball, as a fraction of the shortest screen side
const KICK_DELAY = 0.14;                // seconds between release and the ball leaving the boot

const V3 = THREE.Vector3;
const UP = new V3(0, 1, 0);

/* ======================================================================
   RENDERER, SCENE, CAMERA
   ====================================================================== */
const $ = id => document.getElementById(id);
const glCanvas = $('gl'), fx = $('fx'), fctx = fx.getContext('2d');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  $('fallback').style.display = 'flex';
  return;
}
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b1433, 75, 230);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

let W = 1, H = 1, DPR = 1;
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);
  fx.width = Math.round(W * DPR); fx.height = Math.round(H * DPR);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const aspect = W / H;
  // keep roughly 38 degrees of horizontal view on tall screens so the goal always fits
  const vf = 2 * Math.atan(Math.tan(19 * Math.PI / 180) / aspect);
  camera.fov = clamp(THREE.MathUtils.radToDeg(vf), 38, 62);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  if (typeof placeCamera === 'function' && state !== 'shot') { placeCamera(); computeReference(); }
}

/* ======================================================================
   TEXTURES (all drawn on canvases, so the project has no image files)
   ====================================================================== */
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = maxAniso;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}

const PITCH_W = 68, PITCH_Z0 = -6, PITCH_Z1 = 54;       // pitch texture covers x -34..34, z -6..54
function makePitchTexture() {
  const S = 30;                                           // pixels per metre
  const w = PITCH_W * S, h = (PITCH_Z1 - PITCH_Z0) * S;
  return canvasTex(w, h, (g) => {
    const stripe = 5.5 * S;
    for (let y = 0, i = 0; y < h; y += stripe, i++) {
      g.fillStyle = i % 2 ? '#2f8a3c' : '#379944';
      g.fillRect(0, y, w, stripe);
    }
    for (let i = 0; i < 26000; i++) {                     // grass grain
      g.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.06)' : 'rgba(255,255,255,.04)';
      g.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 3, 1);
    }
    const X = x => (x + PITCH_W / 2) * S, Z = z => (z - PITCH_Z0) * S;
    g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineWidth = 0.13 * S; g.lineJoin = 'miter';
    g.beginPath(); g.moveTo(X(-34), Z(0)); g.lineTo(X(34), Z(0)); g.stroke();                       // goal line
    g.beginPath(); g.moveTo(X(-34), Z(0)); g.lineTo(X(-34), Z(PITCH_Z1)); g.stroke();               // touchlines
    g.beginPath(); g.moveTo(X(34), Z(0)); g.lineTo(X(34), Z(PITCH_Z1)); g.stroke();
    g.strokeRect(X(-20.16), Z(0), 40.32 * S, 16.5 * S);                                             // penalty area
    g.strokeRect(X(-9.16), Z(0), 18.32 * S, 5.5 * S);                                               // six-yard box
    g.fillStyle = 'rgba(255,255,255,.95)';
    g.beginPath(); g.arc(X(0), Z(11), 0.2 * S, 0, Math.PI * 2); g.fill();                           // penalty spot
    const a = Math.acos(5.5 / 9.15);                                                                // penalty arc
    g.beginPath(); g.arc(X(0), Z(11), 9.15 * S, Math.PI / 2 - a, Math.PI / 2 + a); g.stroke();
  });
}

function makeCrowdTexture() {
  return canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = '#10141f'; g.fillRect(0, 0, w, h);
    const cols = ['#d7192d', '#e8e8ee', '#1d5fc0', '#f2c744', '#7c8394', '#2b3347', '#fff', '#c41a2a', '#1b4a98'];
    for (let row = 0; row < 64; row++) {
      const y = row * 8 + 4;
      g.fillStyle = row % 8 === 7 ? 'rgba(0,0,0,.55)' : 'rgba(0,0,0,0)'; g.fillRect(0, row * 8, w, 8);  // aisles
      for (let x = (row % 2) * 5; x < w; x += 10) {
        const c = Math.random() < 0.18 ? '#272f42' : pick(cols);
        g.fillStyle = c; g.fillRect(x + 1, y, 8, 5);                                                // torso
        g.fillStyle = pick(['#f1c9a5', '#d9a47f', '#a8714b', '#6e4730']);
        g.beginPath(); g.arc(x + 5, y - 1.2, 2.3, 0, Math.PI * 2); g.fill();                         // head
      }
    }
  }, { repeat: true });
}

function makeAdTexture() {
  return canvasTex(2048, 128, (g, w, h) => {
    const items = [
      ['#d7192d', '#fff', CFG.homeTeam],
      ['#f4f4f6', '#1d5fc0', 'FREE KICK HERO'],
      ['#1d5fc0', '#fff', CFG.awayTeam],
      ['#0d1426', '#ffd23f', 'ENSCHEDE  -  HEERENVEEN']
    ];
    const seg = w / 8;
    for (let i = 0; i < 8; i++) {
      const [bg, fg, t] = items[i % items.length];
      g.fillStyle = bg; g.fillRect(i * seg, 0, seg, h);
      g.fillStyle = fg; g.font = 'italic 800 52px "Barlow Condensed", Impact, "Arial Narrow", sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(t, i * seg + seg / 2, h / 2 + 2, seg - 24);
    }
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(0, h - 10, w, 10);
  });
}

function makeNetTexture() {
  return canvasTex(128, 128, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(0, 1.5); g.lineTo(w, 1.5); g.moveTo(1.5, 0); g.lineTo(1.5, h); g.stroke();
  }, { repeat: true });
}

function makeBallTexture() {
  return canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = '#f7f7f4'; g.fillRect(0, 0, w, h);
    const phi = (1 + Math.sqrt(5)) / 2;                                    // dark patches at the 12 icosahedron corners
    const dirs = [];
    [[0, 1, phi], [0, -1, phi], [0, 1, -phi], [0, -1, -phi]].forEach(v => dirs.push(v));
    [[1, phi, 0], [-1, phi, 0], [1, -phi, 0], [-1, -phi, 0]].forEach(v => dirs.push(v));
    [[phi, 0, 1], [-phi, 0, 1], [phi, 0, -1], [-phi, 0, -1]].forEach(v => dirs.push(v));
    g.fillStyle = '#1b1f27';
    for (const d of dirs) {
      const l = Math.hypot(...d), x = d[0] / l, y = d[1] / l, z = d[2] / l;
      const u = (Math.atan2(x, z) / (2 * Math.PI) + 0.5) * w, v = (0.5 - Math.asin(y) / Math.PI) * h;
      const sx = 34 / Math.max(0.25, Math.cos(Math.asin(y))), sy = 34;
      for (const off of [-w, 0, w]) {
        g.beginPath(); g.ellipse(u + off, v, sx, sy, 0, 0, Math.PI * 2); g.fill();
      }
    }
  });
}

function makeGlowTexture() {
  return canvasTex(128, 128, (g, w, h) => {
    const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, h);
  });
}

/* ======================================================================
   STADIUM
   ====================================================================== */
const lights = {};
function buildStadium() {
  // sky dome with a soft horizon glow and a few stars
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(420, 24, 14),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vP; void main(){ float h = clamp(normalize(vP).y, 0.0, 1.0);' +
        'vec3 c = mix(vec3(0.16,0.22,0.43), vec3(0.015,0.03,0.09), pow(h, 0.5)); gl_FragColor = vec4(c, 1.0); }'
    })
  );
  scene.add(sky);
  const starGeo = new THREE.BufferGeometry(), sp = [];
  for (let i = 0; i < 260; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.random() * 1.1 + 0.25;
    sp.push(Math.sin(ph) * Math.cos(th) * 400, Math.cos(ph) * 400, Math.sin(ph) * Math.sin(th) * 400);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 1.6, color: 0xdfe8ff, sizeAttenuation: false, fog: false })));

  // lights
  scene.add(new THREE.HemisphereLight(0xaec2ff, 0x1e3a22, 0.75));
  const sun = new THREE.DirectionalLight(0xfff1dc, 1.25);
  sun.position.set(-18, 34, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera; sc.left = -22; sc.right = 22; sc.top = 24; sc.bottom = -24; sc.near = 5; sc.far = 120;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  scene.add(sun); scene.add(sun.target);
  lights.sun = sun;
  const fill = new THREE.DirectionalLight(0x9db8ff, 0.35);
  fill.position.set(25, 12, 10); scene.add(fill);

  // pitch
  const pitchTex = makePitchTexture();
  const pitch = new THREE.Mesh(
    new THREE.PlaneGeometry(PITCH_W, PITCH_Z1 - PITCH_Z0),
    new THREE.MeshStandardMaterial({ map: pitchTex, roughness: 1, metalness: 0 })
  );
  pitch.rotation.x = -Math.PI / 2; pitch.position.set(0, 0, (PITCH_Z0 + PITCH_Z1) / 2);
  pitch.receiveShadow = true; scene.add(pitch);
  const apron = new THREE.Mesh(                                 // dark grass beyond the touchlines and goal line
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: 0x1c4a26, roughness: 1 })
  );
  apron.rotation.x = -Math.PI / 2; apron.position.set(0, -0.02, 20); apron.receiveShadow = true; scene.add(apron);

  // crowd + stands behind the goal and along the sides
  const crowdTex = makeCrowdTexture();
  const crowdMat = (rx, ry) => {
    const t = crowdTex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding;
    return new THREE.MeshStandardMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.42, roughness: 1 });
  };
  const concrete = new THREE.MeshStandardMaterial({ color: 0x1a2030, roughness: 1 });
  function stand(width, x, z, rotY, depth = 24, rise = 14, start = 0) {
    const g = new THREE.Group();
    const len = Math.hypot(depth, rise);
    const slope = new THREE.Mesh(new THREE.PlaneGeometry(width, len), crowdMat(width / 40, len / 14));
    slope.rotation.x = -(Math.PI / 2 - Math.atan2(rise, depth));           // tilt back, away from the pitch
    slope.position.set(0, rise / 2 + 1.0, -(depth / 2) - start);
    g.add(slope);
    const front = new THREE.Mesh(new THREE.BoxGeometry(width, 1.6, 0.6), concrete);
    front.position.set(0, 0.8, -start); g.add(front);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(width, 0.7, depth * 0.62), concrete);
    roof.position.set(0, rise + 5.2, -(depth * 0.72) - start); g.add(roof);
    for (let i = 0; i < Math.floor(width / 6); i++) {                       // glowing roof lamps
      const lamp = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.3, 0.5), new THREE.MeshBasicMaterial({ color: 0xfff4d6, fog: false }));
      lamp.position.set(-width / 2 + 3 + i * 6, rise + 4.7, -(depth * 0.4) - start); g.add(lamp);
    }
    g.position.set(x, 0, z); g.rotation.y = rotY;
    scene.add(g);
  }
  stand(130, 0, -7.5, 0);                         // behind the goal
  stand(90, -37, 25, Math.PI / 2, 20, 12, 0);     // left
  stand(90, 37, 25, -Math.PI / 2, 20, 12, 0);     // right

  // advertising boards
  const adTex = makeAdTexture();
  const adMat = new THREE.MeshStandardMaterial({ map: adTex, emissive: 0xffffff, emissiveMap: adTex, emissiveIntensity: 0.7, roughness: 0.6 });
  function board(len, x, z, rotY) {
    const t = adTex.clone(); t.needsUpdate = true; t.wrapS = THREE.RepeatWrapping; t.repeat.set(len / 40, 1);
    const m = adMat.clone(); m.map = t; m.emissiveMap = t;
    const b = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.95), m);
    b.position.set(x, 0.5, z); b.rotation.y = rotY; scene.add(b);
  }
  board(78, 0, -6.2, 0);
  board(70, -35.4, 28, Math.PI / 2);
  board(70, 35.4, 28, -Math.PI / 2);

  // floodlight towers beyond the far stand
  const glow = makeGlowTexture();
  [[-24, -36], [24, -36], [-60, 10], [60, 10]].forEach(([x, z]) => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 46, 8), concrete);
    pole.position.set(x, 23, z); scene.add(pole);
    const head = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 1), new THREE.MeshBasicMaterial({ color: 0xfffbe6, fog: false }));
    head.position.set(x, 47, z); head.lookAt(0, 47, 30); scene.add(head);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, color: 0xfff1c9, transparent: true, opacity: 0.9, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
    s.scale.set(46, 46, 1); s.position.set(x, 47, z + 1); scene.add(s);
  });
}

/* ======================================================================
   GOAL
   ====================================================================== */
const goalNets = [];
function buildGoal() {
  const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
  const post = (x) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(POST, POST, GH, 12), white);
    m.position.set(x, GH / 2, 0); m.castShadow = true; scene.add(m);
  };
  post(-HALF); post(HALF);
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(POST, POST, GW + POST * 2, 12), white);
  bar.rotation.z = Math.PI / 2; bar.position.set(0, GH, 0); bar.castShadow = true; scene.add(bar);

  // back frame: stays slim so the net reads clearly
  const back = new THREE.MeshStandardMaterial({ color: 0xdfe4ee, roughness: 0.5 });
  const rod = (a, b) => {
    const len = a.distanceTo(b);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, len, 6), back);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(UP, b.clone().sub(a).normalize());
    scene.add(m);
  };
  [-HALF, HALF].forEach(x => {
    rod(new V3(x, GH, 0), new V3(x, GH - 0.25, -NET_TOP_BACK));
    rod(new V3(x, GH - 0.25, -NET_TOP_BACK), new V3(x, 0.02, -NET_BACK));
    rod(new V3(x, 0.02, -NET_BACK), new V3(x, 0.02, 0));
  });
  rod(new V3(-HALF, GH - 0.25, -NET_TOP_BACK), new V3(HALF, GH - 0.25, -NET_TOP_BACK));
  rod(new V3(-HALF, 0.02, -NET_BACK), new V3(HALF, 0.02, -NET_BACK));

  // net panels (UVs in metres so the mesh cells stay the same size everywhere)
  const netTex = makeNetTexture();
  const netMat = new THREE.MeshBasicMaterial({ map: netTex, transparent: true, side: THREE.DoubleSide, depthWrite: false, opacity: 0.8 });
  netTex.repeat.set(1, 1);
  netMat.map.wrapS = netMat.map.wrapT = THREE.RepeatWrapping;
  function quad(a, b, c, d) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([...a.toArray(), ...b.toArray(), ...c.toArray(), ...d.toArray()], 3));
    const w = a.distanceTo(b) * 8, h = a.distanceTo(d) * 8;
    geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, w, 0, w, h, 0, h], 2));
    geo.setIndex([0, 1, 2, 0, 2, 3]);
    const m = new THREE.Mesh(geo, netMat); m.renderOrder = 5; scene.add(m);
  }
  const tl = (x, y, z) => new V3(x, y, z);
  quad(tl(-HALF, GH, 0), tl(HALF, GH, 0), tl(HALF, GH - 0.25, -NET_TOP_BACK), tl(-HALF, GH - 0.25, -NET_TOP_BACK));  // roof
  quad(tl(-HALF, GH - 0.25, -NET_TOP_BACK), tl(HALF, GH - 0.25, -NET_TOP_BACK), tl(HALF, 0, -NET_BACK), tl(-HALF, 0, -NET_BACK)); // back
  [-HALF, HALF].forEach(x => {                                                                                    // sides
    quad(tl(x, 0, 0), tl(x, 0, -NET_BACK), tl(x, GH - 0.25, -NET_TOP_BACK), tl(x, GH, 0));
  });
  // dark patch behind the net so it reads against the grass
  const shade = new THREE.Mesh(new THREE.PlaneGeometry(GW, 0.01), new THREE.MeshBasicMaterial({ visible: false }));
  scene.add(shade);
}

const H0 = 0.95;                                   // hip pivot height; "body" rotates around this point
function shirtTexture(kind, name) {
  return canvasTex(512, 256, (g, w, h) => {
    if (kind === 'twente') {
      g.fillStyle = '#d7192d'; g.fillRect(0, 0, w, h);
      g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(0, 0, w, 14);
      if (name) {
        g.fillStyle = '#fff'; g.font = '700 30px Impact, "Arial Narrow", "Barlow Condensed", Arial, sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        const label = name.toUpperCase(), fit = Math.min(1, 118 / g.measureText(label).width);
        for (const cx of [0, w]) {                                                              // the back of the shirt is u = 0 / 1
          g.save(); g.translate(cx, 70); g.scale(fit, 1); g.fillText(label, 0, 0); g.restore();
        }
      }
    } else if (kind === 'heerenveen') {
      const n = 16, sw = w / n;
      for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? '#f3f5fa' : '#1d5fc0'; g.fillRect(i * sw, 0, sw, h); }
    } else {
      g.fillStyle = '#c5f01a'; g.fillRect(0, 0, w, h);
      g.fillStyle = 'rgba(0,0,0,.12)'; for (let i = 0; i < 8; i++) g.fillRect(i * 64 + 40, 0, 10, h);
    }
  }, { repeat: true });
}
const kits = {
  twente:     { tex: null, shirt: 0xd7192d, shorts: 0xf4f4f4, socks: 0xd7192d, boots: 0x15171c },
  heerenveen: { tex: null, shirt: 0x1d5fc0, shorts: 0xf4f4f4, socks: 0x1d5fc0, boots: 0x1a1d24 },
  keeper:     { tex: null, shirt: 0xc5f01a, shorts: 0x15171c, socks: 0x15171c, boots: 0xff6a00, gloves: 0xff6a00 }
};

function makePerson(kitName, opts = {}) {
  const kit = kits[kitName];
  const skin = new THREE.MeshStandardMaterial({ color: opts.skin || 0xe6b794, roughness: 0.8 });
  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 });
  const shirtMap = shirtTexture(kitName, opts.name);
  const shirtSide = new THREE.MeshStandardMaterial({ map: shirtMap, roughness: 0.85 });
  const shirtFlat = mat(kit.shirt);
  const root = new THREE.Group();
  const body = new THREE.Group(); body.position.y = H0; root.add(body);
  const add = (parent, geo, material, x, y, z, shadow = true) => {
    const m = new THREE.Mesh(geo, material); m.position.set(x, y, z); m.castShadow = shadow; parent.add(m); return m;
  };
  const cyl = (rt, rb, h, seg = 10) => new THREE.CylinderGeometry(rt, rb, h, seg);

  // legs (pivot at the hip)
  const legs = [-1, 1].map(side => {
    const leg = new THREE.Group(); leg.position.set(side * 0.1, 0.92 - H0, 0); body.add(leg);
    add(leg, cyl(0.098, 0.086, 0.3), mat(kit.shorts), 0, -0.15, 0);
    add(leg, cyl(0.074, 0.068, 0.17), skin, 0, -0.385, 0);
    add(leg, cyl(0.067, 0.06, 0.42), mat(kit.socks), 0, -0.68, 0);
    add(leg, new THREE.BoxGeometry(0.1, 0.07, 0.27), mat(kit.boots), 0, -0.885, -0.06);
    return leg;
  });
  const hips = add(body, cyl(0.185, 0.2, 0.2, 14), mat(kit.shorts), 0, 0.98 - H0, 0); hips.scale.set(1.15, 1, 0.78);
  const torso = add(body, new THREE.CylinderGeometry(0.215, 0.18, 0.56, 20, 1), [shirtSide, shirtFlat, shirtFlat], 0, 1.27 - H0, 0);
  torso.scale.set(1.12, 1, 0.7);

  // arms (pivot at the shoulder)
  const arms = [-1, 1].map(side => {
    const arm = new THREE.Group(); arm.position.set(side * 0.27, 1.5 - H0, 0); body.add(arm);
    add(arm, new THREE.SphereGeometry(0.07, 10, 8), shirtFlat, 0, 0, 0);
    add(arm, cyl(0.058, 0.052, 0.25), kitName === 'heerenveen' ? shirtSide : shirtFlat, 0, -0.125, 0);
    add(arm, cyl(0.045, 0.04, 0.26), skin, 0, -0.37, 0);
    add(arm, new THREE.SphereGeometry(kit.gloves ? 0.072 : 0.05, 10, 8), kit.gloves ? mat(kit.gloves) : skin, 0, -0.53, 0);
    return arm;
  });

  // head
  const head = new THREE.Group(); head.position.set(0, 1.71 - H0, 0); body.add(head);
  add(body, cyl(0.05, 0.055, 0.1), skin, 0, 1.59 - H0, 0, false);
  add(head, new THREE.SphereGeometry(0.115, 18, 14), skin, 0, 0, 0);
  const hair = add(head, new THREE.SphereGeometry(0.123, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.56), mat(opts.hair || 0x5a3a1e), 0, 0.012, 0.004);
  hair.rotation.x = -0.28;
  const eyeMat = mat(0x1a1a1a);

  root.userData = { body, legs, arms, head, torso };
  if (opts.scale) root.scale.setScalar(opts.scale);
  return root;
}

function faceToward(obj, x, z) {          // models face -z by default
  obj.rotation.y = Math.atan2(-(x - obj.position.x), -(z - obj.position.z));
}

let state = 'aim';              // aim | drawing | shot | result | over

let best = 0;
try { best = parseInt(localStorage.getItem('fkh3d_best') || '0', 10) || 0; } catch (e) { /* storage may be blocked */ }

const B = new V3();                       // ball start spot
const A = new V3(0, 0, -1);               // unit vector from the ball towards the goal (horizontal)
const RIGHT = new V3(1, 0, 0);
const ball = { pos: new V3(), vel: new V3(), prev: new V3(), inNet: false };
const camBase = new V3();

let ref = null;                           // screen/world reference for building shots
let hintTimer = 0;

let stadiumBuilt = false;

function ensureWorld() {
  if (stadiumBuilt) return;
  stadiumBuilt = true;
  buildStadium(); buildGoal(); buildBall();
  // keeper
  keeper = { obj: makePerson('keeper', { skin: 0xd9a47f, hair: 0x2b1d12 }), x: 0, vx: 0, targetX: 0, locked: false, committed: false, react: 0, adapt: 0, speed: 5, err: 0, lean: 0, dir: 0, jump: 0 };
  scene.add(keeper.obj);
  striker = { obj: makePerson('twente', { name: CFG.playerName, skin: 0xedc3a0, hair: 0xb98a4c }), t: -1, start: new V3(), end: new V3(), cel: 0 };
  scene.add(striker.obj);
}

function newAttempt() {
  ensureWorld();
  const bx = rand(-9, 9), bz = rand(15.5, 20.5);
  B.set(bx, R, bz);
  A.set(-bx, 0, -bz).normalize();
  RIGHT.set(-A.z, 0, A.x);

  // wall on the line between ball and goal centre
  wall.forEach(w => scene.remove(w.obj));
  wall = [];
  const n = Math.min(5, 3 + Math.floor(attempt / 2));
  const c = B.clone().addScaledVector(A, WALL_DIST);
  const skins = [0xf0c8a4, 0xe0ac85, 0xc58a62, 0x8d5a3b, 0xf6d7bb];
  const hairs = [0x2b1d12, 0x5a3a1e, 0xb88a4a, 0x111111, 0x8a8a8a];
  for (let i = 0; i < n; i++) {
    const o = makePerson('heerenveen', { skin: pick(skins), hair: pick(hairs), scale: rand(0.96, 1.04) });
    const p = c.clone().addScaledVector(RIGHT, (i - (n - 1) / 2) * WALL_SP);
    o.position.set(p.x, 0, p.z); faceToward(o, B.x, B.z);
    const u = o.userData;
    u.arms[0].rotation.set(0.55, 0, 0.32); u.arms[1].rotation.set(0.55, 0, -0.32);   // hands protecting the groin
    scene.add(o);
    wall.push({ obj: o, x: p.x, z: p.z, jump: 0 });
  }

  // keeper
  Object.assign(keeper, { x: 0, vx: 0, targetX: 0, locked: false, committed: false, lean: 0, dir: 0, jump: 0,
    react: 0.46 - 0.04 * SKILL,                     // seconds before he reads the ball's direction
    adapt: 0.03 + 0.03 * SKILL,                     // after that he can still adjust for a short while, then he is committed
    speed: 1.8 + 0.5 * SKILL + 0.1 * attempt,       // sideways speed (m/s)
    err: rand(-1, 1) * (1.9 - 0.25 * SKILL) });     // misjudgement of where the ball will cross the line (m)
  keeper.obj.position.set(0, 0, KEEPER_Z); keeper.obj.rotation.set(0, 0, 0); faceToward(keeper.obj, B.x, B.z);

  // striker stands just behind and to the left of the ball
  const sp = B.clone().addScaledVector(RIGHT, -1.7).addScaledVector(A, -1.3);
  const ep = B.clone().addScaledVector(RIGHT, -0.62).addScaledVector(A, -0.4);
  striker.start.copy(sp); striker.end.copy(ep); striker.t = -1; striker.cel = 0;
  striker.obj.position.set(sp.x, 0, sp.z); striker.obj.rotation.set(0, 0, 0);
  striker.obj.userData.body.rotation.set(0, 0, 0); striker.obj.userData.body.position.y = H0;
  faceToward(striker.obj, B.x + A.x * 4, B.z + A.z * 4);

  path = null; travel = 0; shotClock = 0; raw = []; result = null; resultT = 0; slowmo = 1; goalCelebrate = 0;
  state = 'aim';
  placeCamera(); computeReference();
  hideBanner();
  setHint(attempt === 0 ? 'Drag from the ball and curve your shot around the wall' : 'Drag from the ball to take your free kick', true);
  updateHUD();
}

function restart() {
  attempt = 0; goals = 0; shotLog = [];
  $('over').classList.remove('show');
  newAttempt();
}

/* ======================================================================
   CAMERA & SCREEN <-> WORLD MAPPING
   ====================================================================== */
function placeCamera() {
  camBase.copy(B).addScaledVector(A, -CAM_BACK); camBase.y = CAM_H;
  camera.position.copy(camBase);
  camera.lookAt(0, LOOK_Y, 0);
  camera.updateMatrixWorld(true);
}

const _v = new V3();
function project(p) {                                       // world -> CSS pixels
  _v.copy(p).project(camera);
  return { x: (_v.x * 0.5 + 0.5) * W, y: (-_v.y * 0.5 + 0.5) * H, z: _v.z };
}
function rayDir(px, py, out) {                              // CSS pixel -> world ray direction
  out.set((px / W) * 2 - 1, -(py / H) * 2 + 1, 0.5).unproject(camera).sub(camera.position).normalize();
  return out;
}

/* A drawn line on the screen only gives x and y. The depth comes from how far along the line
   the ball is: after one "goal-distance" of drawing (the length from the ball to the middle
   of the goal on screen) the ball reaches the goal. The depth curve is taken from a ground
   line between the ball and the goal, so a line drawn straight at the goal rolls along the
   grass, and a line drawn above it lifts the ball. */
function computeReference() {
  const ballScr = project(B);
  const goalMid = project(new V3(0, GH / 2, 0));
  const ballGround = project(new V3(B.x, 0, B.z));
  const goalGround = project(new V3(0, 0, 0));
  const L = Math.hypot(goalMid.x - ballScr.x, goalMid.y - ballScr.y);
  const N = 48, table = [];
  const dir = new V3();
  const camRel = camera.position.clone().sub(B).dot(A);
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const px = lerp(ballGround.x, goalGround.x, t), py = lerp(ballGround.y, goalGround.y, t);
    rayDir(px, py, dir);
    const s = (0 - camera.position.y) / dir.y;
    const gp = camera.position.clone().addScaledVector(dir, s);
    table.push(gp.sub(B).dot(A));
  }
  table[0] = 0;
  ref = { ballScr, goalMid, L, table, N, camRel, Dg: Math.hypot(B.x, B.z) };
  table[N] = ref.Dg;
}
function depthAt(t) {                                       // distance along A from the ball for path fraction t
  const { table, N } = ref;
  if (t <= 0) return 0;
  if (t >= 1) { const slope = (table[N] - table[N - 2]) / (2 / N); return table[N] + slope * (t - 1); }
  const f = t * N, i = Math.floor(f);
  return lerp(table[i], table[i + 1], f - i);
}

/* ======================================================================
   INPUT (mouse and touch through pointer events)
   ====================================================================== */
function ptr(e) { const r = fx.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }

fx.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = ptr(e);
  if (state === 'aim') {
    const b = project(ball.pos);
    if (Math.hypot(p.x - b.x, p.y - b.y) <= Math.max(52, GRAB_PX * Math.min(W, H) * 1.6)) {
      state = 'drawing'; raw = [{ x: b.x, y: b.y }]; drawStart = performance.now();
      try { fx.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      setHint('', false);
    } else {
      setHint('Start your drag on the ball', true, 1800);
    }
  } else if (state === 'result' && resultT > 0.7) {

  }
});
fx.addEventListener('pointermove', e => {
  if (state !== 'drawing') return;
  e.preventDefault();
  const p = ptr(e), last = raw[raw.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) > 5 && raw.length < 500) raw.push({ x: clamp(p.x, 0, W), y: clamp(p.y, 0, H) });

window.addEventListener('pointerup', () => { if (state === 'drawing') release(); });
window.addEventListener('pointercancel', () => { if (state === 'drawing') { state = 'aim'; raw = []; } });
fx.addEventListener('contextmenu', e => e.preventDefault());
$('again').addEventListener('click', restart);

/* ======================================================================
   SHOT PATH
   ====================================================================== */
function polyLen(pts) { let l = 0; for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return l; }
function smooth(pts, passes) {
  let a = pts;
  for (let k = 0; k < passes; k++) {
    const b = [a[0]];
    for (let i = 1; i < a.length - 1; i++) b.push({ x: (a[i - 1].x + a[i].x + a[i + 1].x) / 3, y: (a[i - 1].y + a[i].y + a[i + 1].y) / 3 });
    b.push(a[a.length - 1]); a = b;
  }
  return a;
}
function resample(pts, step) {
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let prev = pts[0], need = step;
  for (let i = 1; i < pts.length; i++) {
    let a = prev; const b = pts[i];
    let seg = Math.hypot(b.x - a.x, b.y - a.y);
    while (seg >= need) {
      const t = need / seg; a = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; out.push(a);
      seg = Math.hypot(b.x - a.x, b.y - a.y); need = step;
    }
    need -= seg; prev = b;
  }
  const lp = pts[pts.length - 1], lo = out[out.length - 1];
  if (Math.hypot(lp.x - lo.x, lp.y - lo.y) > 0.5) out.push({ x: lp.x, y: lp.y });
  return out;
}

function buildPath(rawPts) {
  const step = Math.max(3, Math.min(W, H) * 0.009);
  const pts = resample(smooth(rawPts, 3), step);
  // keep going in the final direction of the drawn line
  const n = pts.length, from = pts[Math.max(0, n - 8)], last = pts[n - 1];
  let dx = last.x - from.x, dy = last.y - from.y; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
  let len = polyLen(pts);
  const maxLen = ref.L * 2.4;
  let cur = last;
  while (len < maxLen) { cur = { x: cur.x + dx * step, y: cur.y + dy * step }; pts.push(cur); len += step; }

  const P = [], cum = [0], dir = new V3();
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    if (i > 0) s += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    const d = depthAt(s / ref.L);
    rayDir(pts[i].x, pts[i].y, dir);
    const k = (d - ref.camRel) / dir.dot(A);               // distance along the ray to the plane "d metres from the ball"
    const p = camera.position.clone().addScaledVector(dir, Math.max(0.1, k));
    p.y = Math.max(R, p.y);
    P.push(p);
    if (i > 0) cum.push(cum[i - 1] + p.distanceTo(P[i - 1]));
  }
  P[0].copy(B);
  return { P, cum, total: cum[cum.length - 1], idx: 0 };
}
function posAt(pa, sd, out) {
  const n = pa.P.length - 1;
  if (sd >= pa.total) {
    const dd = pa.P[n].clone().sub(pa.P[n - 3]).normalize();
    return out.copy(pa.P[n]).addScaledVector(dd, sd - pa.total);
  }
  if (sd < pa.cum[pa.idx]) pa.idx = 0;
  while (pa.idx < n - 1 && pa.cum[pa.idx + 1] < sd) pa.idx++;
  const a = pa.P[pa.idx], b = pa.P[pa.idx + 1];
  const seg = pa.cum[pa.idx + 1] - pa.cum[pa.idx] || 1;
  return out.lerpVectors(a, b, (sd - pa.cum[pa.idx]) / seg);
}

function release() {
  const len = polyLen(raw);
  if (len < Math.min(W, H) * 0.12 || raw.length < 3) {
    state = 'aim'; raw = [];
    setHint('Drag further to draw your shot', true, 1800);
    return;
  }
  const elapsed = Math.max(0.12, (performance.now() - drawStart) / 1000);
  const pxPerSec = len / elapsed / Math.min(W, H) * 480;              // normalised so phones and desktops feel the same
  shotSpeed = lerp(17, 31, clamp((pxPerSec - 250) / 1400, 0, 1));    // faster flick = harder shot (m/s)
  raw[0] = project(ball.pos);
  path = buildPath(raw);
  travel = 0; shotClock = -KICK_DELAY; striker.t = 0;
  state = 'shot';
  setHint('', false);
}

/* ======================================================================
   RULES & PHYSICS
   ====================================================================== */
function stepShot(h) {
  shotClock += h;
  if (shotClock < 0) return;
  ball.prev.copy(ball.pos);
  travel += shotSpeed * (1 - 0.15 * clamp(travel / 40, 0, 1)) * h;
  posAt(path, travel, ball.pos);
  ball.vel.copy(ball.pos).sub(ball.prev).divideScalar(h);
  spinBall(ball.pos.distanceTo(ball.prev));

  // 1. the wall (the players jump just as the ball is struck)
  for (const w of wall) {
    const dx = ball.pos.x - w.x, dz = ball.pos.z - w.z, d = Math.hypot(dx, dz);
    if (d < WALL_R + R && ball.pos.y < WALL_H + w.jump + R) {
      const nx = dx / (d || 1), nz = dz / (d || 1), dot = ball.vel.x * nx + ball.vel.z * nz;
      ball.vel.x = (ball.vel.x - 2 * dot * nx) * 0.4; ball.vel.z = (ball.vel.z - 2 * dot * nz) * 0.4;
      ball.vel.y = Math.abs(ball.vel.y) * 0.3 + 2.5;
      ball.pos.x = w.x + nx * (WALL_R + R + 0.02); ball.pos.z = w.z + nz * (WALL_R + R + 0.02);
      return finish('blocked');
    }
  }
  // 2. the keeper: his reach grows when he is stretching sideways
  if (Math.abs(ball.pos.z - KEEPER_Z) < 0.55 && ball.vel.z < 0) {
    const ax = 0.5 + 0.7 * keeper.lean, ay = 0.95 + 0.3 * keeper.lean;
    const cy = 1.0 + 0.2 * keeper.lean + keeper.jump * 0.5;
    const q = Math.pow((ball.pos.x - keeper.x) / ax, 2) + Math.pow((ball.pos.y - cy) / ay, 2);
    if (q < 1) {
      const sp = Math.max(4, ball.vel.length() * 0.28);
      ball.vel.set(rand(-1, 1) * sp, rand(1, 3.5), Math.abs(rand(0.5, 1)) * sp);
      return finish('saved');
    }
  }
  // 3. crossing the goal line
  if (ball.prev.z > 0 && ball.pos.z <= 0) {
    const f = ball.prev.z / (ball.prev.z - ball.pos.z);
    const x = lerp(ball.prev.x, ball.pos.x, f), y = lerp(ball.prev.y, ball.pos.y, f);
    const rr = POST + R;
    if (Math.abs(x) < HALF + rr && y > GH - rr && y < GH + rr) {
      ball.vel.set(rand(-1.5, 1.5), 1.5, Math.abs(ball.vel.z) * 0.35); return finish('bar');
    }
    if (y >= GH + rr) return finish('over');
    if (Math.abs(x) < HALF - rr) {
      ball.vel.multiplyScalar(0.45); ball.inNet = true; return finish('goal');
    }
    if (Math.abs(Math.abs(x) - HALF) <= rr) {
      ball.vel.set(Math.sign(x) * rand(1, 3), 1, Math.abs(ball.vel.z) * 0.35); return finish('post');
    }
    return finish('wide');
  }
  if (ball.pos.z < -6 || Math.abs(ball.pos.x) > 40 || ball.pos.y > 40 || ball.pos.z > 60) finish('wide');
}

function stepLoose(h) {
  ball.vel.y -= 9.8 * h;
  ball.pos.addScaledVector(ball.vel, h);
  if (ball.pos.y < R) {
    ball.pos.y = R;
    if (ball.vel.y < -1) ball.vel.y *= -0.5; else ball.vel.y = 0;
    ball.vel.x *= 0.85; ball.vel.z *= 0.85;
  }
  if (ball.pos.y <= R + 0.001) { const f = Math.exp(-1.6 * h); ball.vel.x *= f; ball.vel.z *= f; }
  if (ball.inNet) {                                            // the net catches the ball
    const bz = -(NET_BACK - 0.25 - R);
    if (ball.pos.z < bz) { ball.pos.z = bz; ball.vel.z = Math.abs(ball.vel.z) * 0.12; ball.vel.x *= 0.5; }
    const sx = HALF - R;
    if (ball.pos.x > sx) { ball.pos.x = sx; ball.vel.x = -Math.abs(ball.vel.x) * 0.2; }
    if (ball.pos.x < -sx) { ball.pos.x = -sx; ball.vel.x = Math.abs(ball.vel.x) * 0.2; }
    const top = GH - R - 0.2 * clamp(-ball.pos.z / NET_TOP_BACK, 0, 1);
    if (ball.pos.y > top) { ball.pos.y = top; ball.vel.y = -Math.abs(ball.vel.y) * 0.2; }
  }
  spinBall(ball.vel.length() * h);
}

const _ax = new V3(), _q = new THREE.Quaternion();
function spinBall(dist) {
  const v = ball.vel;
  if (dist < 1e-5 || Math.hypot(v.x, v.z) < 0.05) return;
  _ax.set(0, 1, 0).cross(new V3(v.x, 0, v.z).normalize()).normalize();
  ballMesh.quaternion.premultiply(_q.setFromAxisAngle(_ax, dist / VR));
}

const BANNERS = {
  goal:    ['GOAL!', 'What a free kick!', '#ffd23f'],
  saved:   ['SAVED!', 'The keeper got there', '#ffffff'],
  blocked: ['BLOCKED!', 'Curve it around the wall', '#ffffff'],
  wide:    ['WIDE!', 'Just off target', '#ffffff'],
  over:    ['OVER THE BAR!', 'A little too much power', '#ffffff'],
  post:    ['OFF THE POST!', 'So close', '#ffffff'],
  bar:     ['OFF THE BAR!', 'So close', '#ffffff']
};

function finish(r) {
  result = r; resultT = 0; state = 'result';
  shotLog.push(r === 'goal' ? 'goal' : 'miss');
  if (r === 'goal') { goals++; shake = 0.45; goalCelebrate = 0; slowmo = 0.4; }
  showBanner(r);
  updateHUD();
}

function nextAttempt() {
  attempt++;
  hideBanner();
  if (attempt >= SHOTS) {
    state = 'over';
    if (goals > best) { best = goals; try { localStorage.setItem('fkh3d_best', String(best)); } catch (e) { /* ignore */ } }
    const ratio = goals / SHOTS;
    $('oScore').textContent = goals + '/' + SHOTS;
    $('oMsg').textContent = ratio === 1 ? 'Perfect round. Absolutely clinical!' : ratio >= 0.6 ? 'Great set-piece taking!' : goals > 0 ? 'Not bad. Keep practising!' : 'Not your day. Try again!';
    $('oBest').textContent = 'Best round: ' + best + '/' + SHOTS;
    $('over').classList.add('show');
    setHint('', false);
  } else newAttempt();
}

/* ======================================================================
   KEEPER AI
   ====================================================================== */
function updateKeeper(h) {
  const k = keeper;
  const old = k.x;
  if (state === 'shot' && shotClock >= 0 && !k.locked) {
    if (shotClock > k.react && ball.vel.z < -1) {
      // he reads the ball's *current* direction, so a late curve can fool him
      const tt = ball.pos.z / -ball.vel.z;
      const px = ball.pos.x + ball.vel.x * tt, py = ball.pos.y + ball.vel.y * tt;
      if (Math.abs(px) > HALF + 0.4) {                      // heading wide of the post: he only shuffles across
        k.targetX = clamp(px * 0.3, -1.3, 1.3); k.jump = 0;
      } else {
        k.targetX = clamp(px + k.err, -HALF + 0.2, HALF - 0.2);
        k.jump = py > 1.6 ? 1 : 0;
      }
      k.committed = true;
      if (shotClock > k.react + k.adapt) k.locked = true;
    }
  }
  if (state === 'aim' || state === 'drawing') {
    k.targetX = Math.sin(time * 1.4) * 0.35;
    k.x += clamp(k.targetX - k.x, -1.2 * h, 1.2 * h);
  } else if (k.committed) {
    const dist = k.targetX - k.x, sp = Math.min(Math.abs(dist) * 9, k.speed * 1.2);
    k.x += Math.sign(dist) * Math.min(Math.abs(dist), sp * h);
  } else if (state === 'result') {
    k.x += clamp(0 - k.x, -1.5 * h, 1.5 * h);
  }
  k.vx = (k.x - old) / h;
  const diving = k.committed && Math.abs(k.targetX - k.x) > 0.05 || Math.abs(k.vx) > 2;
  const want = k.committed ? clamp(Math.abs(k.vx) / 4.5, 0, 1) * (Math.abs(k.targetX) > 0.9 ? 1 : 0.45) : 0;
  k.lean = lerp(k.lean, want, Math.min(1, 12 * h));
  if (k.vx !== 0) k.dir = lerp(k.dir, Math.sign(k.vx), Math.min(1, 14 * h));
  if (!k.committed) k.dir = lerp(k.dir, 0, Math.min(1, 6 * h));
  // pose
  const u = k.obj.userData, o = k.obj;
  o.position.x = k.x;
  const lean = k.lean;
  u.body.rotation.z = (state === 'shot' || state === 'result') ? -k.dir * lean * 1.25 * Math.sign(1) : 0;
  u.body.position.y = H0 + 0.28 * lean + (k.jump ? 0.18 : 0);
  const up = clamp(lean * 1.2 + (k.jump ? 0.5 : 0), 0, 1);
  const ready = (state === 'aim' || state === 'drawing') ? 0.38 + Math.sin(time * 3) * 0.04 : 0.45;
  u.arms[0].rotation.set(0.25, 0, -lerp(ready, 2.7, up)); u.arms[1].rotation.set(0.25, 0, lerp(ready, 2.7, up));
  u.legs[0].rotation.set(0, 0, lerp(-0.18, -0.6, lean)); u.legs[1].rotation.set(0, 0, lerp(0.18, 0.6, lean));
  void diving;
}

/* ======================================================================
   ANIMATION OF THE OTHER PLAYERS
   ====================================================================== */
function updateStriker(h) {
  const s = striker, u = s.obj.userData;
  const t = s.t;
  if (state === 'aim' || state === 'drawing') {
    u.legs[0].rotation.x = Math.sin(time * 2) * 0.03; u.legs[1].rotation.x = 0;
    u.arms[0].rotation.set(0, 0, -0.12); u.arms[1].rotation.set(0, 0, 0.12);
    u.body.position.y = H0 + Math.sin(time * 2.4) * 0.008;
    return;
  }
  if (t >= 0 && state !== 'over') {
    s.t += h;
    const run = clamp(s.t / KICK_DELAY, 0, 1), e = easeOut(run);
    const away = easeOut(clamp((s.t - KICK_DELAY - 0.2) / 2.2, 0, 1));                      // after the kick he jogs off to the side
    s.obj.position.x = lerp(s.start.x, s.end.x, e) + (-RIGHT.x * 1.2 + A.x * 3.5) * away;
    s.obj.position.z = lerp(s.start.z, s.end.z, e) + (-RIGHT.z * 1.2 + A.z * 3.5) * away;
    const swing = s.t < KICK_DELAY ? -0.9 * run : lerp(-0.9, 1.35, easeOut(clamp((s.t - KICK_DELAY) / 0.12, 0, 1)));
    const follow = clamp((s.t - KICK_DELAY - 0.25) / 0.6, 0, 1);
    u.legs[1].rotation.x = lerp(swing, 0.2, follow);
    u.legs[0].rotation.x = lerp(-0.12, 0.05, run);
    u.arms[0].rotation.set(lerp(0, 0.7, clamp(run, 0, 1)), 0, -0.4); u.arms[1].rotation.set(lerp(0, -0.6, run), 0, 0.5);
    u.body.rotation.x = lerp(0, -0.12, run) * (1 - follow);
    u.body.position.y = H0;
  }
  if (state === 'result' && result === 'goal') {
    goalCelebrate += h;
    const j = Math.abs(Math.sin(goalCelebrate * 6)) * 0.22;
    u.body.position.y = H0 + j;
    u.arms[0].rotation.set(0, 0, -2.7); u.arms[1].rotation.set(0, 0, 2.7);
    u.legs[1].rotation.x = 0;
  } else if (state === 'result' && s.t > 0.6) {
    u.arms[0].rotation.set(-2.5, 0, -0.3); u.arms[1].rotation.set(-2.5, 0, 0.3);   // hands on head
  }
}

function updateWall(h) {
  for (const w of wall) {
    if (state === 'shot' && shotClock > -0.02) {
      const tj = shotClock + 0.02;
      w.jump = tj < 0.6 ? 0.34 * Math.sin(Math.PI * tj / 0.6) : 0;
    } else if (state !== 'result') w.jump = 0;
    else if (w.jump > 0) w.jump = Math.max(0, w.jump - 2 * h);
    w.obj.position.y = w.jump;
    const u = w.obj.userData;
    u.legs[0].rotation.x = u.legs[1].rotation.x = w.jump > 0.02 ? -0.5 : 0;
  }
}

/* ======================================================================
   UI HELPERS
   ====================================================================== */
const hint = $('hint');
function setHint(text, show, ms) {
  clearTimeout(setHint.t);
  hint.textContent = text; hint.classList.toggle('hide', !show || !text);
  if (show && ms) setHint.t = setTimeout(() => { if (state === 'aim') setHint(attempt === 0 ? 'Drag from the ball and curve your shot around the wall' : 'Drag from the ball to take your free kick', true); }, ms);
}
function showBanner(r) {
  const [title, sub, col] = BANNERS[r], b = $('banner');
  $('bTitle').textContent = title; $('bTitle').style.color = col; $('bSub').textContent = sub; $('bTap').style.opacity = 0;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  setTimeout(() => { $('bTap').style.opacity = 0.75; }, 700);
}
function hideBanner() { $('banner').classList.remove('show'); }
function updateHUD() {
  $('tHome').textContent = CFG.homeTeam; $('tAway').textContent = CFG.awayTeam;
  $('goals').textContent = goals;
  $('shotn').textContent = Math.min(attempt + 1, SHOTS); $('shotsTotal').textContent = SHOTS;
  const pips = $('pips');
  if (pips.children.length !== SHOTS) { pips.innerHTML = ''; for (let i = 0; i < SHOTS; i++) { const d = document.createElement('div'); d.className = 'pip'; pips.appendChild(d); } }
  [...pips.children].forEach((d, i) => { d.className = 'pip' + (shotLog[i] === 'goal' ? ' goal' : shotLog[i] === 'miss' ? ' miss' : ''); });
}

/* 2D overlay: ring around the ball, and the line being drawn */
function drawOverlay() {
  fctx.clearRect(0, 0, W, H);
  if (state === 'aim') {
    const b = project(ball.pos);
    const edge = project(new V3().copy(ball.pos).addScaledVector(RIGHT, VR * 1.4));
    const r = Math.max(18, Math.hypot(edge.x - b.x, edge.y - b.y) * 2.2) + Math.sin(time * 5) * 2.5;
    fctx.save(); fctx.strokeStyle = 'rgba(255,255,255,.9)'; fctx.lineWidth = 2.5; fctx.setLineDash([7, 6]); fctx.lineDashOffset = -time * 24;
    fctx.beginPath(); fctx.arc(b.x, b.y, r, 0, Math.PI * 2); fctx.stroke(); fctx.restore();
  }
  if (state === 'drawing' && raw.length > 1) {
    fctx.save(); fctx.lineCap = 'round'; fctx.lineJoin = 'round';
    const line = () => { fctx.beginPath(); fctx.moveTo(raw[0].x, raw[0].y); for (const p of raw) fctx.lineTo(p.x, p.y); };
    fctx.strokeStyle = 'rgba(0,0,0,.4)'; fctx.lineWidth = 9; line(); fctx.stroke();
    fctx.strokeStyle = '#fff'; fctx.lineWidth = 4; fctx.setLineDash([11, 9]); fctx.lineDashOffset = -time * 40; line(); fctx.stroke();
    const e = raw[raw.length - 1], b = raw[Math.max(0, raw.length - 6)], an = Math.atan2(e.y - b.y, e.x - b.x);
    fctx.setLineDash([]); fctx.fillStyle = '#fff'; fctx.translate(e.x, e.y); fctx.rotate(an);
    fctx.beginPath(); fctx.moveTo(15, 0); fctx.lineTo(-6, -10); fctx.lineTo(-6, 10); fctx.closePath(); fctx.fill();
    fctx.restore();
  }
}

/* ======================================================================
   FRAME UPDATE
   ====================================================================== */
const camLook = new V3(0, LOOK_Y, 0), camPos = new V3();
function updateCamera(dt) {
  let push = 0, tx = 0, ty = LOOK_Y, tz = 0;
  if (state === 'result') {
    const e = easeOut(clamp(resultT / 1.6, 0, 1));
    push = (result === 'goal' ? 7 : 1.5) * e;
    if (result === 'goal') ty = LOOK_Y + 1.6 * e;
  }
  camPos.copy(camBase).addScaledVector(A, push);
  if (shake > 0) { camPos.x += rand(-1, 1) * shake * 0.08; camPos.y += rand(-1, 1) * shake * 0.08; }
  camera.position.copy(camPos);
  camLook.set(tx, ty, tz);
  camera.lookAt(camLook);
}

function update(dt) {
  time += dt;
  if (shake > 0) shake = Math.max(0, shake - dt);
  const sub = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / sub;
  for (let i = 0; i < sub; i++) {
    if (state === 'shot') stepShot(h);
    else if (state === 'result') stepLoose(h);
  }
  updateKeeper(dt); updateStriker(dt); updateWall(dt);
  if (state === 'result') { resultT += dt / Math.max(slowmo, 0.01) * slowmo; if (slowmo < 1 && resultT > 0.9) slowmo = Math.min(1, slowmo + dt * 1.5); }
  if (state === 'result' && resultT > 2.7) nextAttempt();

  ballMesh.position.copy(ball.pos);
  if (state === 'shot' || state === 'result') {
    trailHist.unshift(ball.pos.clone()); if (trailHist.length > trailSprites.length) trailHist.pop();
  } else trailHist.length = 0;
  trailSprites.forEach((s, i) => {
    const p = trailHist[i * 1];
    if (!p || state === 'aim' || state === 'drawing') { s.visible = false; return; }
    const f = 1 - i / trailSprites.length;
    s.visible = true; s.position.copy(p); s.material.opacity = 0.28 * f; s.scale.setScalar(0.12 + 0.34 * f);
  });
  updateCamera(dt);
  // keep the shadow frustum around the action
  lights.sun.position.set(B.x - 14, 34, B.z + 14); lights.sun.target.position.set(B.x * 0.5, 0, B.z * 0.55 - 2); lights.sun.target.updateMatrixWorld();
}

let last = null;
function frame(now) {
  if (window.__FK_MANUAL) { requestAnimationFrame(frame); return; }            // automated tests step the game themselves
  if (last === null) last = now;
  const dt = clamp((now - last) / 1000, 0.001, 0.05); last = now;
  update(dt * (state === 'result' ? slowmo : 1) || dt);
  renderer.render(scene, camera);
  drawOverlay();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
ensureWorld();
resize();
newAttempt();
requestAnimationFrame(frame);

// small hook so the game can be driven by automated tests
window.__FK = {
  get state() { return state; }, get result() { return result; }, get goals() { return goals; }, get attempt() { return attempt; },
  ball, wall: () => wall, keeper: () => keeper, project: p => project(new V3(p.x, p.y, p.z)), ref: () => ref, B, A,
  get W() { return W; }, get H() { return H; }, camera,
  sim: (dt, n = 1) => { for (let i = 0; i < n; i++) update(dt); },
  fire: (pts, ms) => { state = 'drawing'; raw = pts; drawStart = performance.now() - ms; release(); },
  render: () => { renderer.render(scene, camera); drawOverlay(); },
  next: () => nextAttempt(), path: () => path && path.P.map(p => [p.x, p.y, p.z])
};
})();
</script>
